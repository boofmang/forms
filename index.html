<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
<body>
    <div id="fullflex">
<div id="imagebox">
    <div id="imgback">
        <img src="odin-lined.png" height="100%" width="15%">
        ODIN BABY
    </div>
    
</div>
<div id="nextflex">
<div class="card">
    <h2>THE FUTURE!</h2>
    <p>Welcome to a brand new world! Submit your details here and I <em>Swear!</em> I will not use them for any malicious purposes..... </p>
</div>
<div id="formcontainer">
    <form action="" method="post">
    <h2>Lets go boys</h2>
    <div id="rows">
        <div class="row">
            <div class="formstyle">
            <label for="firstname">First Name:</label>
            <input type="text">
            </div>
            <div class="formstyle">
            <label for="lastname">Surname:</label>
            <input type="text">
            </div>
        </div>
        <div class="row">
            <div class="formstyle">
            <label for="email">Email:</label><input type="text">
            </div>
            <div class="formstyle">
            <label for="phone">Phone Number:</label><input type="text">
            </div>
        </div>
        <div class="row">
            <div class="formstyle">
                <label for="password">Password:</label>
                <input type="text">
            </div>
            <div class="formstyle">
                <label for="confirm">Confirm Password:</label>
                <input type="text">
            </div>
        </div>
    </div>
    </form>
</div>

<div class="card">
    <button id="Submit">Submit Information</button>
    <p class="log">Already a member? <a href="">Log in</a></p>
</div>
</div>




</div>

</html>
